<svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 0 750 500" fill="none" aria-hidden="true">
	<defs>
		<linearGradient id="chartFill" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0%" style="stop-color: var(--primary-color)" stop-opacity="0" />
			<stop offset="100%" style="stop-color: var(--primary-color)" stop-opacity="0.15" />
		</linearGradient>
	</defs>

	<!-- COIN STACK -->
	<g transform="translate(210, 270)">
		<!-- Coin 4 (bottom) -->
		<path
			d="M-52,52 L-52,62 A52,20 0 0,0 52,62 L52,52 A52,20 0 0,1 -52,52 Z"
			style="fill: var(--primary-color)"
			opacity="0.35"
		/>
		<ellipse cx="0" cy="52" rx="52" ry="20" style="fill: var(--primary-color)" opacity="0.5" />

		<!-- Coin 3 -->
		<path
			d="M-52,34 L-52,44 A52,20 0 0,0 52,44 L52,34 A52,20 0 0,1 -52,34 Z"
			style="fill: var(--primary-color)"
			opacity="0.4"
		/>
		<ellipse cx="0" cy="34" rx="52" ry="20" style="fill: var(--primary-color)" opacity="0.6" />

		<!-- Coin 2 -->
		<path
			d="M-52,16 L-52,26 A52,20 0 0,0 52,26 L52,16 A52,20 0 0,1 -52,16 Z"
			style="fill: var(--primary-color)"
			opacity="0.5"
		/>
		<ellipse cx="0" cy="16" rx="52" ry="20" style="fill: var(--primary-color)" opacity="0.75" />

		<!-- Coin 1 (top) -->
		<path
			d="M-52,-2 L-52,8 A52,20 0 0,0 52,8 L52,-2 A52,20 0 0,1 -52,-2 Z"
			style="fill: var(--primary-color)"
			opacity="0.6"
		/>
		<ellipse cx="0" cy="-2" rx="52" ry="20" style="fill: var(--primary-color)" />
		<ellipse
			cx="0"
			cy="-2"
			rx="36"
			ry="14"
			fill="none"
			style="stroke: var(--default-text-color)"
			stroke-width="1.5"
			opacity="0.4"
		/>
	</g>

	<!-- PHONE -->
	<g transform="translate(510, 240) rotate(-8) skewY(12)">
		<rect x="-85" y="-150" width="170" height="300" rx="16" style="fill: var(--app-card-color)" />
		<rect x="-73" y="-115" width="146" height="220" rx="8" style="fill: var(--app-background-color)" />

		<!-- Header placeholders -->
		<rect x="-60" y="-100" width="60" height="6" rx="3" style="fill: var(--accent-text-color)" opacity="0.4" />
		<rect x="-60" y="-86" width="80" height="10" rx="3" style="fill: var(--default-text-color)" opacity="0.25" />

		<!-- Chart line -->
		<polyline
			points="-58,60 -30,30 -5,45 25,-10 50,5 65,-40"
			style="stroke: var(--primary-color)"
			stroke-width="2.5"
			fill="none"
			stroke-linecap="round"
			stroke-linejoin="round"
		/>
		<path d="M-58,60 L-30,30 L-5,45 L25,-10 L50,5 L65,-40 L65,80 L-58,80 Z" fill="url(#chartFill)" />

		<!-- Chart dots -->
		<circle cx="-58" cy="60" r="3" style="fill: var(--primary-color)" opacity="0.7" />
		<circle cx="-30" cy="30" r="3" style="fill: var(--primary-color)" opacity="0.7" />
		<circle cx="-5" cy="45" r="3" style="fill: var(--primary-color)" opacity="0.7" />
		<circle cx="25" cy="-10" r="3" style="fill: var(--primary-color)" opacity="0.7" />
		<circle cx="50" cy="5" r="3" style="fill: var(--primary-color)" opacity="0.7" />
		<circle cx="65" cy="-40" r="4" style="fill: var(--primary-color)" />

		<!-- Bottom nav -->
		<circle cx="-30" cy="125" r="5" style="fill: var(--accent-text-color)" opacity="0.3" />
		<circle cx="0" cy="125" r="5" style="fill: var(--primary-color)" opacity="0.4" />
		<circle cx="30" cy="125" r="5" style="fill: var(--accent-text-color)" opacity="0.3" />
	</g>

	<!-- GROWTH ARROW -->
	<g transform="translate(360, 95)">
		<circle cx="0" cy="0" r="24" style="fill: var(--accent-text-color)" opacity="0.08" />
		<circle
			cx="0"
			cy="0"
			r="24"
			style="stroke: var(--accent-text-color)"
			stroke-width="1.5"
			fill="none"
			opacity="0.2"
		/>
		<path
			d="M0,10 L0,-10 M-7,-3 L0,-10 L7,-3"
			style="stroke: var(--accent-text-color)"
			stroke-width="2.5"
			stroke-linecap="round"
			stroke-linejoin="round"
		/>
	</g>

	<!-- FLOATING SMALL COINS -->
	<g transform="translate(130, 170)" opacity="0.4">
		<path
			d="M-16,2 L-16,6 A16,6 0 0,0 16,6 L16,2 A16,6 0 0,1 -16,2 Z"
			style="fill: var(--primary-color)"
			opacity="0.5"
		/>
		<ellipse cx="0" cy="2" rx="16" ry="6" style="fill: var(--primary-color)" opacity="0.8" />
	</g>

	<g transform="translate(660, 370)" opacity="0.3">
		<path
			d="M-12,2 L-12,5 A12,5 0 0,0 12,5 L12,2 A12,5 0 0,1 -12,2 Z"
			style="fill: var(--primary-color)"
			opacity="0.5"
		/>
		<ellipse cx="0" cy="2" rx="12" ry="5" style="fill: var(--primary-color)" opacity="0.8" />
	</g>

	<!-- DECORATIVE DOTS -->
	<circle cx="320" cy="190" r="3" style="fill: var(--accent-text-color)" opacity="0.2" />
	<circle cx="580" cy="400" r="2" style="fill: var(--primary-color)" opacity="0.2" />
	<circle cx="150" cy="370" r="2.5" style="fill: var(--accent-text-color)" opacity="0.15" />
	<circle cx="700" cy="150" r="2" style="fill: var(--primary-color)" opacity="0.15" />
	<circle cx="280" cy="120" r="1.5" style="fill: var(--accent-text-color)" opacity="0.15" />
</svg>