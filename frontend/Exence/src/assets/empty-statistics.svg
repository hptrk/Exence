<?xml version="1.0" encoding="utf-8"?>
<svg width="240" height="200" viewBox="0 0 240 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dashboard frame -->
  <rect x="30" y="20" width="180" height="140" rx="12" stroke="rgb(180,180,220)" stroke-width="2" fill="none"/>
  <!-- Top bar -->
  <rect x="30" y="20" width="180" height="24" rx="12" fill="rgb(200,200,242)" opacity="0.4"/>
  <circle cx="48" cy="32" r="4" fill="rgb(200,200,242)"/>
  <circle cx="62" cy="32" r="4" fill="rgb(200,200,242)"/>
  <circle cx="76" cy="32" r="4" fill="rgb(200,200,242)"/>
  <!-- Bar chart -->
  <rect x="55" y="100" width="16" height="40" rx="3" fill="rgb(200,200,242)" opacity="0.6"/>
  <rect x="80" y="80" width="16" height="60" rx="3" fill="rgb(200,200,242)" opacity="0.8"/>
  <rect x="105" y="90" width="16" height="50" rx="3" fill="rgb(200,200,242)" opacity="0.5"/>
  <rect x="130" y="70" width="16" height="70" rx="3" fill="rgb(200,200,242)" opacity="0.7"/>
  <rect x="155" y="85" width="16" height="55" rx="3" fill="rgb(200,200,242)" opacity="0.6"/>
  <!-- Trend line -->
  <polyline points="63,95 88,75 113,82 138,62 163,78" stroke="rgb(160,160,210)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Stat card placeholders -->
  <rect x="50" y="52" width="40" height="20" rx="4" stroke="rgb(200,200,242)" stroke-width="1.5" fill="none" stroke-dasharray="4 3"/>
  <rect x="100" y="52" width="40" height="20" rx="4" stroke="rgb(200,200,242)" stroke-width="1.5" fill="none" stroke-dasharray="4 3"/>
  <rect x="150" y="52" width="40" height="20" rx="4" stroke="rgb(200,200,242)" stroke-width="1.5" fill="none" stroke-dasharray="4 3"/>
  <!-- Plus icon -->
  <circle cx="195" cy="170" r="18" fill="rgb(200,200,242)" opacity="0.5"/>
  <line x1="195" y1="162" x2="195" y2="178" stroke="rgb(140,140,200)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="187" y1="170" x2="203" y2="170" stroke="rgb(140,140,200)" stroke-width="2.5" stroke-linecap="round"/>
</svg>
