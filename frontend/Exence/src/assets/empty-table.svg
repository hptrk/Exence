<?xml version="1.0" encoding="utf-8"?>
<svg width="240" height="200" viewBox="0 0 240 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="lens">
      <circle cx="100" cy="90" r="62"/>
    </clipPath>
  </defs>
  <!-- Magnifying glass circle -->
  <circle cx="100" cy="90" r="62" stroke="rgb(200,200,242)" stroke-width="9" fill="none"/>
  <!-- Handle -->
  <line x1="147" y1="137" x2="188" y2="178" stroke="rgb(200,200,242)" stroke-width="11" stroke-linecap="round"/>
  <!-- Bar chart bars clipped to glass -->
  <g clip-path="url(#lens)">
    <rect x="60" y="108" width="16" height="90" rx="3" fill="rgb(200,200,242)" opacity="0.6"/>
    <rect x="82" y="85" width="16" height="113" rx="3" fill="rgb(200,200,242)" opacity="0.8"/>
    <rect x="104" y="95" width="16" height="103" rx="3" fill="rgb(200,200,242)" opacity="0.5"/>
    <rect x="126" y="75" width="16" height="123" rx="3" fill="rgb(200,200,242)" opacity="0.7"/>
  </g>
</svg>
