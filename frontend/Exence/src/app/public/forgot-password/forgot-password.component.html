<mat-card class="flex-column justify-content-center align-items-center gap-4 p-5 text-center text-md-start">
	<mat-card-header class="flex-column gap-2 justify-content-center w-100">
		<mat-icon
			class="mx-auto mb-5"
			size="2xxl"
			[svgIcon]="svgIcons.logo"
		/>
		<h2 class="fs-1">Forgot password?</h2>
		<p class="m-0 fs-4">
			No worries, we'll send you reset instructions.
		</p>
	</mat-card-header>

	<mat-card-content class="w-100">
		<mat-form-field appearance="outline">
			<mat-label>Email</mat-label>
			<input matInput [formControl]="emailControl" type="email"/>
			@if (emailControl.touched && emailControl.invalid) {
				<mat-error>
					Email is <strong>required</strong>!
				</mat-error>
			}
		</mat-form-field>
	</mat-card-content>

	<mat-card-actions class="flex-column-reverse flex-md-row justify-content-center align-items-center gap-3 w-100 px-4">
		<ex-button outlined color="accent" class="w-100">
			Back
		</ex-button>

		<ex-button filled (click)="null" class="w-100">
			Request new password
		</ex-button>
	</mat-card-actions>
</mat-card>
