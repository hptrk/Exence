<div class="d-flex flex-column align-items-center justify-content-center">
	<h2
		class="m-0 fs-2 d-flex flex-row flex-nowrap gap-2 justify-content-between align-items-center"
		[class.w-100]="!hideCloseButton()"
	>
		<ng-content select="[ex-dialog-card-title]" />
		@if (!hideCloseButton()) {
			<ex-button iconButton matIcon="close" (click)="onCloseClick()" color="accent" />
		}
	</h2>

	<h3 class="m-0 fs-5 fw-normal py-2">
		<ng-content select="[ex-dialog-card-subtitle]" />
	</h3>
</div>

<div class="flex-grow-1 overflow-y-auto">
	<ng-content select="[ex-dialog-card-content]" />
</div>

<div class="d-flex justify-content-end w-100">
	<ng-content select="[ex-dialog-card-actions]" />
</div>
