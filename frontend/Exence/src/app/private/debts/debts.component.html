<main
	class="d-flex flex-column p-2 pb-0 p-sm-3 p-md-4 gap-4"
	[class.overflow-hidden]="display.isLg()"
	[class.h-100]="display.isLg()"
>
	<ex-debt-statistics />

	<div
		class="d-flex flex-column flex-lg-row flex-nowrap gap-4"
		[class.h-100]="display.isLg()"
		[class.overflow-hidden]="display.isLg()"
	>
		<ex-debt-list
			class="flex-grow-1"
			matIcon="arrow_circle_up"
			[title]="'debts.myDebts' | translate"
			[type]="debtTypes.BORROWED"
		/>
		<ex-debt-list
			class="flex-grow-1"
			matIcon="arrow_circle_down"
			[title]="'debts.owedToMe' | translate"
			[type]="debtTypes.LENT"
		/>
	</div>
</main>
