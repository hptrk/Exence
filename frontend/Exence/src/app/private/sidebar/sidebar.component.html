@if (display.isMd | async) {
	<mat-drawer-container
		class="h-100"
	>
		<mat-drawer
			mode="side"
			opened
			disableClose
		>
			<div class="d-flex flex-column align-items-center h-100 py-4 gap-5">
				<a
					class="px-2"
					[routerLink]="navigationService.private().index()"
				>
					<mat-icon
						class="h-auto w-auto m-0"
						[svgIcon]="svgIcons.logoHorizontal"
					/>
				</a>
				<div class="d-flex flex-column w-100 h-100 fs-4 gap-4 flex-grow-1 fw-medium">
					<a
						ex-nav-button
						class="d-flex align-items-center gap-2"
						[routerLink]="navigationService.private().dashboard()"
						routerLinkActive="active"
					>
						<mat-icon>home</mat-icon>
						Dashboard
					</a>

					<a
						ex-nav-button
						class="d-flex align-items-center gap-2"
						[routerLink]="navigationService.private().transactions()"
						routerLinkActive="active"
					>
						<mat-icon>sync_alt</mat-icon>
						Transactions
					</a>
					<a
						ex-nav-button
						class="d-flex align-items-center gap-2"
						[routerLink]="navigationService.private().statistics()"
						routerLinkActive="active"
					>
						<mat-icon>leaderboard</mat-icon>
						Statistics
					</a>
					<a
						ex-nav-button
						class="d-flex align-items-center gap-2"
						[routerLink]="navigationService.private().goals()"
						routerLinkActive="active"
					>
						<mat-icon>emoji_events</mat-icon>
						Goals
					</a>
					<a
						ex-nav-button
						class="d-flex align-items-center gap-2"
						[routerLink]="navigationService.private().debts()"
						routerLinkActive="active"
					>
						<mat-icon>account_balance</mat-icon>
						Debts
					</a>
				</div>
				<div class="d-flex gap-4">
					<a [routerLink]="navigationService.private().profile().index()">
						<mat-icon>person</mat-icon>
					</a>
					<a [routerLink]="navigationService.private().settings()">
						<mat-icon>settings</mat-icon>
					</a>
					<button (click)="toggleTheme()">
						<mat-icon>contrast</mat-icon>
					</button>
					<a [routerLink]="navigationService.account().logout()">
						<mat-icon>logout</mat-icon>
					</a>
				</div>
			</div>
		</mat-drawer>
		<mat-drawer-content>
			<ng-container [ngTemplateOutlet]="pageContent"></ng-container>
		</mat-drawer-content>
	</mat-drawer-container>
} @else {
	<div class="mobile-view">
		<div class="flex-grow-1 flex-shrink-1 overflow-y-auto">
			<ng-container [ngTemplateOutlet]="pageContent" />
		</div>
		<ng-container [ngTemplateOutlet]="mobile" />
	</div>
}

<ng-template #pageContent>
	<ng-content />
</ng-template>

<ng-template #mobile>
	<div class="position-sticky bottom-0 start-0 p-2 w-100 mobile-navigation">
		<div
			class="d-flex flex-row justify-content-around align-items-center w-100 h-100 fs-4 gap-2 flex-grow-1 fw-medium mobile-actions"
		>
			<a
				ex-nav-button
				class="d-flex align-items-center gap-2 justify-content-center"
				[routerLink]="navigationService.private().dashboard()"
				routerLinkActive="active"
			>
				<mat-icon>home</mat-icon>
			</a>

			<a
				ex-nav-button
				class="d-flex align-items-center gap-2 justify-content-center"
				[routerLink]="navigationService.private().transactions()"
				routerLinkActive="active"
			>
				<mat-icon>sync_alt</mat-icon>
			</a>
			<a
				ex-nav-button
				class="d-flex align-items-center gap-2 justify-content-center"
				[routerLink]="navigationService.private().statistics()"
				routerLinkActive="active"
			>
				<mat-icon>leaderboard</mat-icon>
			</a>
			<a
				ex-nav-button
				class="d-flex align-items-center gap-2 justify-content-center"
				[routerLink]="navigationService.private().goals()"
				routerLinkActive="active"
			>
				<mat-icon>emoji_events</mat-icon>
			</a>
			<a
				ex-nav-button
				class="d-flex align-items-center gap-2 justify-content-center"
				[routerLink]="navigationService.private().debts()"
				routerLinkActive="active"
			>
				<mat-icon>account_balance</mat-icon>
			</a>
			<a
				ex-nav-button
				class="d-flex align-items-center gap-2 justify-content-center"
				[routerLink]="navigationService.private().profile().index()"
				routerLinkActive="active"
			>
				<mat-icon>person</mat-icon>
			</a>
		</div>
	</div>
</ng-template>
