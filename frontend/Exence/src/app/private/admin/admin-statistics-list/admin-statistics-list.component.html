<section class="d-flex flex-column gap-3 overflow-y-auto">
	<article class="card-grid" data-testid="admin-card-grid">
		@for (cardType of cardTypes; track cardType) {
			@if (cardType === widgetType.EMAIL_VERIFICATION_RATE) {
				<ex-stat-card
					data-testid="stat-card"
					class="flex-grow-1"
					[adminCardType]="cardType"
					[customTitle]="'admin.statistics.card.title' | translate"
				/>
			} @else {
				<ex-leaderboard data-testid="leaderboard" class="flex-grow-1" [type]="cardType" [title]="cardData[cardType]! | translate" />
			}
		}
	</article>

	<article class="chart-grid" data-testid="admin-chart-grid">
		@for (chartType of chartTypes; track chartType) {
			<ex-admin-chart data-testid="admin-chart" [type]="chartType" />
		}
	</article>
</section>
