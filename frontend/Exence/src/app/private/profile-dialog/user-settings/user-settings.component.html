<div class="flex-grow-1 overflow-x-hidden overflow-y-auto">
	<ex-theme-select [initialThemes]="initialThemes()" (changed)="themes.set($event)" />

	<mat-divider />

	<ex-language-select [initialLang]="initialLanguage()" (changed)="language.set($event)" />

	<mat-divider />

	<ex-currency-select [currencyInfo]="initialCurrencyInfo()" (changed)="currencyInfo.set($event)" />
</div>

<div class="d-flex flex-column">
	<mat-divider />

	<div class="d-flex flex-column-reverse flex-sm-row justify-content-end align-items-center gap-2 w-100">
		<ex-button outlined color="accent" matIcon="close" (click)="cancel()">
			{{ 'literals.cancel' | translate }}
		</ex-button>
		<ex-button filled color="primary" matIcon="check" iconPositionEnd [disabled]="!hasChanges()" (click)="save()">
			{{ 'literals.save' | translate }}
		</ex-button>
	</div>
</div>
