<mat-card>
	<mat-card-content>
		@if (isLoading() && !data()) {
			<!-- TODO animation -->
		} @else {
			@if (isApexChart()) {
				<apx-chart
					[title]="{ ...data()?.title }"
					[series]="data()?.series ?? []"
					[chart]="data()?.chart ?? { type: 'bar' }"
					[plotOptions]="data()?.plotOptions ?? {}"
					[xaxis]="data()?.xaxis ?? {}"
					[yaxis]="data()?.yaxis ?? {}"
					[legend]="data()?.legend ?? {}"
					[colors]="data()?.colors ?? []"
					[stroke]="data()?.stroke ?? {}"
					[dataLabels]="data()?.dataLabels ?? {}"
					[tooltip]="data()?.tooltip ?? {}"
					[grid]="data()?.grid ?? {}"
					[fill]="data()?.fill ?? {}"
					[labels]="data()?.labels ?? []"
					[responsive]="data()?.responsive ?? []"
				/>
			} @else {
				<ex-sankey-chart [widget]="this.widget()" />
			}
		}
	</mat-card-content>
</mat-card>
