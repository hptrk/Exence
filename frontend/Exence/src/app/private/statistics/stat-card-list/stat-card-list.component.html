<section [style.--stat-col-count]="colCount()">
	<div class="stat-card-list" (scroll)="onCardsScroll($event)">
		<gridster [options]="options()" class="custom-grid" [style.min-width.px]="gridMinWidth()">
			@for (card of cards(); track card.id + ':' + card.x) {
				<gridster-item [item]="card">
					@if (editing()) {
						<ex-button matIcon="drag_indicator" iconButton class="dragger" />
					}
					<ex-stat-card [widget]="card.cardData" />
				</gridster-item>
			}
		</gridster>
	</div>

	@if (editing()) {
		<div
			class="modification-buttons-row"
			[style.min-width.px]="gridMinWidth()"
			[style.transform]="'translateX(-' + scrollLeft() + 'px)'"
		>
			@for (card of cards(); track card.id) {
				<div class="modification-buttons-cell">
					<div class="d-flex flex-column gap-2 position-absolute chart-modification-buttons">
						<ex-button matIcon="delete" (click)="deleteCard(card)" primaryIconButton color="error" />
						<ex-button matIcon="edit" (click)="openEditWidgetDialog(card)" primaryIconButton />
					</div>
				</div>
			}
		</div>
	}
</section>
