@if (isEmpty()) {
	<section
		data-testid="statistics-empty"
		class="d-flex flex-column align-items-center justify-content-center gap-4 h-100"
	>
		<img src="assets/empty-statistics.svg" />
		<div class="d-flex flex-column gap-2 align-items-center text-center">
			<h3 class="fs-2 fw-bold m-0">
				{{ 'statistics.empty.title' | translate }}
			</h3>
			<p class="m-0 fs-5">
				{{ 'statistics.empty.subtitle' | translate }}
			</p>
		</div>
	</section>
} @else {
	<section
		class="d-flex flex-column p-2 pb-0 p-sm-3 p-md-4 poisiton-relative overflow-hidden"
		[class.gap-4]="editing()"
	>
		@if (store.statCards().length) {
			<ex-stat-card-list [data]="store.statCards()" [editing]="editing()" />
		}

		<ex-chart-widget-list [data]="store.charts()" [editing]="editing()" />
	</section>
}

<ng-container [ngTemplateOutlet]="actionButtons" />

<mat-menu #actionsMenu>
	@if (!isEmpty()) {
		<button data-testid="statistics-edit-menu-item" mat-menu-item (click)="editing.set(true)">
			<mat-icon>edit</mat-icon>
			{{ 'statistics.editButton' | translate }}
		</button>
	}
	<button data-testid="statistics-add-menu-item" mat-menu-item (click)="openCatalog()">
		<mat-icon>add</mat-icon>
		{{ 'statistics.addButton' | translate }}
	</button>
</mat-menu>

<ng-template #actionButtons>
	<div class="action-buttons">
		@if (editing()) {
			<ex-button
				data-testid="statistics-cancel-btn"
				(click)="cancelLayout()"
				primaryIconButton
				color="primary"
				matIcon="close"
				size="md"
				rounded
			/>
			<ex-button
				data-testid="statistics-save-btn"
				(click)="saveLayout()"
				primaryIconButton
				color="primary"
				matIcon="check"
				size="lg"
				rounded
			/>
		} @else {
			<ex-button
				data-testid="statistics-more-btn"
				[matMenuTriggerFor]="actionsMenu"
				primaryIconButton
				color="primary"
				matIcon="more_horiz"
				class="edit-button"
				size="lg"
				rounded
			/>
		}
	</div>
</ng-template>
