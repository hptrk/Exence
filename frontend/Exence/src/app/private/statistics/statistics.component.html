<section class="d-flex flex-column p-2 pb-0 p-sm-3 p-md-4 poisiton-relative" [class.gap-4]="editing()">
	<ex-stat-card-list [data]="statCards()" [editing]="editing()" />

	<ex-chart-widget-list [data]="charts()" [editing]="editing()" />

	<ng-container [ngTemplateOutlet]="actionButtons" />
</section>

<ng-template #actionButtons>
	<div class="action-buttons">
		@if (editing()) {
			<ex-button
				(click)="editing.set(false)"
				primaryIconButton
				color="primary"
				matIcon="close"
				size="md"
				rounded
			/>
			<ex-button (click)="(null)" primaryIconButton color="primary" matIcon="check" size="lg" rounded />
		} @else {
			<ex-button
				(click)="editing.set(true)"
				primaryIconButton
				color="primary"
				matIcon="edit"
				class="edit-button"
				size="lg"
				rounded
			/>
		}
	</div>
</ng-template>
