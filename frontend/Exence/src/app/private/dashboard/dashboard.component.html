<section class="d-flex flex-column h-100 justif-content-between p-2 pb-0 p-sm-3 p-md-4 gap-0">
	<div class="d-flex flex-row justify-content-center justify-content-md-between align-items-center gap-2">
		<div>
			<h1 class="m-0 text-center text-md-start {{ display.isSm() ? 'fs-1' : 'fs-2' }}">
				Welcome back, <span class="username">{{ user().username }}</span
				>!
			</h1>
			<p class="fs-4 m-0 text-center text-md-start">Snapshot of your finances</p>
		</div>
		<!-- @if (display.isMd()) {
		<ng-container [ngTemplateOutlet]="toggleFilter" />
	} -->
	</div>

	<div
		class="d-flex flex-column-reverse flex-md-column justify-content-between gap-4 h-100"
		[class.overflow-hidden]="display.isLg()"
	>
		<div
			class="d-flex flex-column flex-md-row justify-content-center justify-content-md-between align-items-md-center gap-4"
		>
			<!-- @if (display.isMd() === false) {
				<div class="mx-auto">
					<ng-container [ngTemplateOutlet]="toggleFilter" />
				</div>
			} -->
			<ex-chart
				[data]="transactions.content"
				[balance]="balance"
			/>
			<ex-categories
				class="h-100"
				[totalExpense]="totals.totalExpense"
				[categories]="topCategories!"
			/>
		</div>

		@if (display.isMd()) {
			<div
				class="d-flex flex-row align-items-center gap-4"
				ex-card-slider
			>
				<ex-summary-container
					class="flex-grow-1"
					matIcon="attach_money"
					title="Income"
					[value]="totals.totalIncome"
					[type]="transactionTypes.INCOME"
				/>
				<ex-summary-container
					class="flex-grow-1"
					matIcon="money_off"
					title="Expenses"
					[value]="totals.totalExpense"
					[type]="transactionTypes.EXPENSE"
				/>
				<ex-summary-container
					class="flex-grow-1"
					matIcon="savings"
					title="Balance"
					[value]="balance"
				/>
				@if (topCategory) {
					<ex-summary-container
						class="flex-grow-1"
						[emoji]="topCategory.emoji"
						[title]="topCategory.name"
						[value]="topCategory.totalAmount"
						[type]="transactionTypes.EXPENSE"
					/>
				}
			</div>
		}

		@if (display.isMd()) {
			<div class="row gap-4 gap-lg-0 h-100 overflow-hidden">
				<ex-data-table
					class="col-12 col-lg-6"
					matIcon="money_off"
					[data]="{ transactions: expenses, categories }"
					title="Expenses"
					[type]="transactionTypes.EXPENSE"
					(dataChangedEvent)="onDataChanged()"
				/>
				<ex-data-table
					class="col-12 col-lg-6"
					matIcon="attach_money"
					[data]="{ transactions: incomes, categories }"
					title="Incomes"
					[type]="transactionTypes.INCOME"
					(dataChangedEvent)="onDataChanged()"
				/>
			</div>
		} @else {
			<div class="d-flex flex-column gap-4 align-items-center h-100">
				<ex-data-table
					class="w-100"
					matIcon="attach_money"
					[data]="{ transactions, categories }"
					title="Transactions"
					(dataChangedEvent)="onDataChanged()"
				/>
				<ng-container [ngTemplateOutlet]="mobileButtons" />
			</div>
		}
	</div>
</section>

<ng-template #toggleFilter>
	<ex-view-toggle />
</ng-template>

<ng-template #mobileButtons>
	<div class="d-flex flex-column-reverse flex-sm-row gap-2 justify-content-center align-items-md-center w-100">
		<ex-button
			filled
			color="error"
			class="flex-grow-1"
			(click)="openCreateTransactionDialog(transactionTypes.EXPENSE)"
		>
			Expense
		</ex-button>
		<ex-button
			filled
			color="success"
			class="flex-grow-1"
			(click)="openCreateTransactionDialog(transactionTypes.INCOME)"
		>
			Income
		</ex-button>
	</div>
</ng-template>
