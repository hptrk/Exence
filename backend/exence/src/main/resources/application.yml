exence:
  database:
    host: ${DB_HOST:localhost}
    port: ${DB_PORT:5432}
    name: ${DB_NAME:exence_db}
  recurring:
    cron: "0 0 0 * * *"
  email:
    domain-whitelist-only: false
    verification-required-paths:
      - /api/statistics
      - /api/goals
    rate-limiting:
      enabled: true
      cooldown-minutes-between-sends: 2
    reminder:
      cron: "0 0 9 */14 * *"
      inactivity-period: 14d
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  logout-from-all-devices: false
  password-history-count: 3
  secure-cookie: false # default for dev, overridden by profiles

external-apis:
  frankfurter:
    base-url: https://api.frankfurter.dev/v2
    timeout: 20000

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${exence.database.host}:${exence.database.port}/${exence.database.name}
    username: ${DB_USERNAME:exencedev}
    password: ${DB_PASSWORD:exencepwd}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:6800}
    username: ${MAIL_USERNAME:noreply@exence.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
            required: false
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000
  jackson:
    default-property-inclusion: non_null

# jwt configuration
jwt:
  secret: ${JWT_SECRET:1d2c3b4a5f6e7d8c9b0a1e2f3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2}
  access-token-expiration: 30m
  refresh-token-expiration: 14d
  email-verification-token-expiration: 24h
  password-reset-token-expiration: 15m
  cleanup-interval: 3600000 # 1 hour in milliseconds

# logging configuration
logging:
  level:
    root: INFO
    com.exence.finance: DEBUG
    com.exence.finance.security: DEBUG
    org.springframework.security: WARN
    org.springframework.web: INFO
    org.springframework.transaction: DEBUG
