              - column: { name: base_currency_amount, valueNumeric: 4600.00 }

        # Recurring Transactions
        # next_execution_date is computed dynamically so test data stays valid at any point in time.
        # Pattern for MONTHLY/day D: CASE WHEN current day < D → this month's D, ELSE → next month's D
        # Pattern for WEEKLY/Monday: next Monday = DATE_TRUNC('week', CURRENT_DATE + 7 days)
        # Pattern for YEARLY/Mar 1: next March 1
        - insert:
            tableName: recurring_transaction
            columns:
              - column: { name: id, valueNumeric: 1 }
              - column: { name: title, value: 'Phone bill' }
              - column: { name: note, value: 'Monthly mobile subscription' }
              - column: { name: amount, valueNumeric: 11208.00 }
              - column: { name: type, value: 'EXPENSE' }
              - column: { name: currency, value: 'HUF' }
              - column: { name: frequency, value: 'MONTHLY' }
              - column: { name: interval_value, valueNumeric: 1 }
              - column: { name: day_of_month, valueNumeric: 8 }
              - column: { name: end_condition, value: 'NEVER' }
              - column: { name: current_occurrences, valueNumeric: 2 }
              - column:
                  name: next_execution_date
                  valueComputed: "CASE WHEN EXTRACT(DAY FROM CURRENT_DATE) < 8 THEN (DATE_TRUNC('month', CURRENT_DATE) + INTERVAL '7 days')::DATE ELSE (DATE_TRUNC('month', CURRENT_DATE + INTERVAL '1 month') + INTERVAL '7 days')::DATE END"
              - column: { name: active, valueBoolean: true }
              - column: { name: category_id, valueNumeric: 4 }
              - column: { name: workspace_id, valueNumeric: 1 }
              - column: { name: created_at, valueComputed: "${now}" }
              - column: { name: updated_at, valueComputed: "${now}" }
              - column: { name: created_by, value: 'captainwinnie@exence.com' }
              - column: { name: updated_by, value: 'captainwinnie@exence.com' }
        - insert:
            tableName: recurring_transaction
            columns:
