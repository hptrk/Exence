databaseChangeLog:
  - changeSet:
      id: create-token-table
      author: hptrk
      comment: Create token table for JWT tokens and session management
      changes:
        - createTable:
            tableName: token
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_token
                    nullable: false
              - column:
                  name: token_value
                  type: VARCHAR(512)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_token_value
              - column:
                  name: jwt_id
                  type: VARCHAR(36)
                  constraints:
                    unique: true
                    uniqueConstraintName: uk_token_jwt_id
              - column:
                  name: session_id
                  type: VARCHAR(36)
              - column:
                  name: token_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: revoked
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: last_used_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: ip_address
                  type: VARCHAR(45)
              - column:
                  name: user_agent
                  type: VARCHAR(512)
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: token
            baseColumnNames: user_id
            constraintName: fk_token_user
            referencedTableName: _user
            referencedColumnNames: id
            onDelete: CASCADE