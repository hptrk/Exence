databaseChangeLog:
  - changeSet:
      id: create-password-history-table
      author: hptrk
      comment: Create password_history table for tracking previous passwords
      changes:
        - createTable:
            tableName: password_history
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_password_history
                    nullable: false
              - column:
                  name: password_hash
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: password_history
            baseColumnNames: user_id
            constraintName: fk_password_history_user
            referencedTableName: _user
            referencedColumnNames: id
            onDelete: CASCADE
