      id: migrate-recurring-transaction-add-workspace-id
      author: hptrk
      comment: Replace user_id with workspace_id on the recurring_transaction table
      dbms: postgresql
      changes:
        - dropForeignKeyConstraint:
            baseTableName: recurring_transaction
            constraintName: fk_recurring_transaction_user
        - dropColumn:
            tableName: recurring_transaction
            columnName: user_id
        - addColumn:
            tableName: recurring_transaction
            columns:
              - column:
                  name: workspace_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: recurring_transaction
            baseColumnNames: workspace_id
            constraintName: fk_recurring_transaction_workspace
            referencedTableName: workspace
            referencedColumnNames: id
            onDelete: CASCADE

  # Step 3c: Migrate category table
