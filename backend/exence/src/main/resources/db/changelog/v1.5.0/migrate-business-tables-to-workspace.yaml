        - addColumn:
            tableName: category
            columns:
              - column:
                  name: workspace_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: category
            baseColumnNames: workspace_id
            constraintName: fk_category_workspace
            referencedTableName: workspace
            referencedColumnNames: id
            onDelete: CASCADE

