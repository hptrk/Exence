databaseChangeLog:
  # Step 1: Drop base_currency + show_base_currency from user_settings (moved to workspace_settings)
  - changeSet:
      id: migrate-drop-currency-from-user-settings
      author: hptrk
      comment: Remove base_currency and show_base_currency from user_settings (moved to workspace_settings)
      changes:
        - dropColumn:
            tableName: user_settings
            columnName: base_currency
        - dropColumn:
            tableName: user_settings
            columnName: show_base_currency
      rollback:
        - addColumn:
            tableName: user_settings
            columns:
              - column:
                  name: base_currency
                  type: supported_currency
              - column:
                  name: show_base_currency
                  type: BOOLEAN
                  defaultValueBoolean: false

  # Step 2: Drop old materialized view (references transaction.user_id; must go before dropColumn)
  - changeSet:
      id: migrate-drop-old-mv-daily-category-stat
      author: hptrk
      comment: >
        Drop the old mv_daily_category_stat (built with user_id) before removing user_id
        from the transaction table. The view will be recreated with workspace_id afterwards.
      dbms: postgresql
      changes:
        - sql:
            sql: DROP MATERIALIZED VIEW IF EXISTS mv_daily_category_stat

  # Step 3a: Migrate transaction table
  - changeSet:
      id: migrate-transaction-add-workspace-id
      author: hptrk
      comment: Replace user_id with workspace_id on the transaction table
      dbms: postgresql
      changes:
        - dropIndex:
            tableName: transaction
            indexName: idx_transaction_user_id_date
        - dropForeignKeyConstraint:
            baseTableName: transaction
            constraintName: fk_transaction_user
        - dropColumn:
            tableName: transaction
            columnName: user_id
        - addColumn:
            tableName: transaction
            columns:
              - column:
                  name: workspace_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: transaction
            baseColumnNames: workspace_id
            constraintName: fk_transaction_workspace
            referencedTableName: workspace
            referencedColumnNames: id
            onDelete: CASCADE
        - createIndex:
            tableName: transaction
            indexName: idx_transaction_workspace_id_date
            columns:
              - column:
                  name: workspace_id
              - column:
                  name: date

  # Step 3b: Migrate recurring_transaction table
