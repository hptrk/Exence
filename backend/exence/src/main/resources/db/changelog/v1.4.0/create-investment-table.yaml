databaseChangeLog:
  - changeSet:
      id: create-investment-sequences
      author: hptrk
      comment: Create sequence for investment table
      changes:
        - createSequence:
            sequenceName: investment_id_seq
            startValue: 1
            incrementBy: 1

      rollback:
        - dropSequence:
            sequenceName: investment_id_seq

  - changeSet:
      id: create-investment-table
      author: hptrk
      comment: Create investment table for tracking asset purchases
      dbms: postgresql
      changes:
        - createTable:
            tableName: investment
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_investment
                    nullable: false
              - column:
                  name: asset
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: purchase_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: investment_type
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: DECIMAL(19, 2)
                  constraints:
                    nullable: false
              - column:
                  name: currency
                  type: supported_currency
                  constraints:
                    nullable: false
              - column:
                  name: base_currency_amount
                  type: DECIMAL(19, 2)
                  constraints:
                    nullable: false
              - column:
                  name: note
                  type: VARCHAR(500)
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: created_by
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: updated_by
                  type: VARCHAR(100)

        - addForeignKeyConstraint:
            baseTableName: investment
            baseColumnNames: user_id
            constraintName: fk_investment_user
            referencedTableName: _user
            referencedColumnNames: id
            onDelete: CASCADE

      rollback:
        - dropTable:
            tableName: investment
