databaseChangeLog:
  - changeSet:
      id: create-user-settings-sequence
      author: hptrk
      comment: Create sequence for user_settings ID generation
      changes:
        - createSequence:
            sequenceName: user_settings_id_seq
            startValue: 1
            incrementBy: 1
      rollback:
        - dropSequence:
            sequenceName: user_settings_id_seq

  - changeSet:
      id: create-user-settings-table
      author: hptrk
      comment: Create user_settings table for user preferences
      changes:
        - createTable:
            tableName: user_settings
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_user_settings
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_user_settings_user_id
                    foreignKeyName: fk_user_settings_user
                    referencedTableName: _user
                    referencedColumnNames: id
                    deleteCascade: true
              - column:
                  name: language
                  type: VARCHAR(2)
                  defaultValue: en
                  constraints:
                    nullable: false
              - column:
                  name: primary_theme
                  type: theme
                  constraints:
                    nullable: false
              - column:
                  name: secondary_theme
                  type: theme
                  constraints:
                    nullable: false
              - column:
                  name: base_currency
                  type: VARCHAR(3)
                  defaultValue: HUF
                  constraints:
                    nullable: false
