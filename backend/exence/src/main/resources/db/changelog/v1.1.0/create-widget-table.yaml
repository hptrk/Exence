databaseChangeLog:
  - changeSet:
      id: create-widget-id-seq
      author: hptrk
      comment: Create sequence for widget ID generation
      changes:
        - createSequence:
            sequenceName: widget_id_seq
            startValue: 1
            incrementBy: 1
      rollback:
        - dropSequence:
            sequenceName: widget_id_seq

  - changeSet:
      id: create-widget-table
      author: hptrk
      comment: Create widget table for configuration of statistics widgets
      changes:
        - createTable:
            tableName: widget
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_widget
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: timeframe
                  type: VARCHAR(30)
              - column:
                  name: display_order
                  type: INTEGER
              - column:
                  name: x
                  type: INTEGER
              - column:
                  name: y
                  type: INTEGER
              - column:
                  name: cols
                  type: INTEGER
              - column:
                  name: rows
                  type: INTEGER
              - column:
                  name: settings
                  type: JSONB
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: widget
            baseColumnNames: user_id
            constraintName: fk_widget_user
            referencedTableName: _user
            referencedColumnNames: id
            onDelete: CASCADE

        - createIndex:
            tableName: widget
            indexName: idx_widget_user_id
            columns:
              - column:
                  name: user_id
