# Create enum type for material_icon and migrate category table to use it instead of emoji
databaseChangeLog:
  - changeSet:
      id: create-material-icon-enum
      author: hptrk
      comment: Create native PostgreSQL enum type for material_icon
      dbms: postgresql
      changes:
        - sql:
            sql: |
              CREATE TYPE material_icon AS ENUM (
                'LOCAL_GROCERY_STORE', 'SHOPPING_BASKET', 'KITCHEN', 'SKILLET', 'EGG', 'NUTRITION',
                'RESTAURANT', 'RESTAURANT_MENU', 'DINE_HEART', 'LUNCH_DINING', 'DINNER_DINING', 'FASTFOOD',
                'LOCAL_PIZZA', 'LOCAL_CAFE', 'BAKERY_DINING', 'CAKE', 'ICECREAM', 'LOCAL_BAR', 'WINE_BAR', 'LIQUOR',
                'HOME', 'HOUSE', 'APARTMENT', 'COTTAGE', 'GARAGE_HOME', 'BED', 'CHAIR', 'CONSTRUCTION',
                'PLUMBING', 'ELECTRICAL_SERVICES', 'MOP', 'LIGHTBULB', 'BOLT', 'WATER_DROP', 'MODE_HEAT',
                'THERMOMETER', 'ENERGY_SAVINGS_LEAF', 'RECYCLING', 'ROUTER', 'WIFI',
                'DIRECTIONS_CAR', 'MOTORCYCLE', 'SCOOTER', 'PEDAL_BIKE', 'LOCAL_GAS_STATION', 'EV_STATION',
                'LOCAL_PARKING', 'AUTO_TOWING', 'LOCAL_TAXI', 'AIRPORT_SHUTTLE', 'DIRECTIONS_BUS', 'COMMUTE',
                'TRAIN', 'SUBWAY', 'TRAM', 'DIRECTIONS_BOAT', 'FLIGHT', 'AIRPLANE_TICKET', 'TRANSIT_TICKET', 'MAP',
                'STORE', 'SHOPPING_CART', 'SHOPPING_BAG', 'SELL', 'PERCENT', 'RECEIPT', 'CARD_GIFTCARD',
                'SEND_MONEY', 'APPAREL', 'CHECKROOM', 'STYLER', 'LAUNDRY', 'EYEGLASSES', 'WATCH', 'DIAMOND',
                'BACKPACK', 'UMBRELLA', 'SMARTPHONE', 'LAPTOP', 'PRINT',
                'LOCAL_HOSPITAL', 'MEDICAL_SERVICES', 'HEALTH_AND_SAFETY', 'EMERGENCY', 'LOCAL_PHARMACY',
                'MEDICATION', 'VACCINES', 'HEALING', 'MONITOR_HEART', 'DENTISTRY', 'PSYCHOLOGY',
                'CLEAN_HANDS', 'WASH', 'BRUSH', 'FACE', 'CONTENT_CUT', 'SPA', 'SELF_IMPROVEMENT',
                'FITNESS_CENTER', 'POOL',
                'FAMILY_RESTROOM', 'PREGNANT_WOMAN', 'DIVERSITY_3', 'DIVERSITY_1', 'CHILD_CARE',
                'BABY_CHANGING_STATION', 'STROLLER', 'CRIB', 'CHILD_FRIENDLY', 'ESCALATOR_WARNING',
                'TOYS', 'VIDEOGAME_ASSET', 'CASTLE', 'SENTIMENT_SATISFIED', 'PETS', 'CRUELTY_FREE',
                'ELDERLY', 'SCHOOL', 'MENU_BOOK', 'HISTORY_2',
                'MOVIE', 'THEATERS', 'LIVE_TV', 'CAMERA_ALT', 'IMAGESMODE', 'HEADPHONES', 'MUSIC_NOTE',
                'PIANO', 'SPORTS_ESPORTS', 'EXTENSION', 'CASINO', 'PALETTE', 'BOOK', 'SPORTS_SOCCER',
                'SPORTS_BASKETBALL', 'SPORTS_TENNIS', 'HIKING', 'KAYAKING', 'DECK', 'EVENT_SEAT',
                'WORK', 'PAID', 'ATTACH_MONEY', 'MONEY_BAG', 'ACCOUNT_BALANCE', 'WALLET',
                'ACCOUNT_BALANCE_WALLET', 'SAVINGS', 'ADD_CARD', 'PAYMENTS', 'CURRENCY_EXCHANGE', 'TOLL',
                'TRENDING_UP', 'TRENDING_DOWN', 'PRICE_CHANGE', 'PIE_CHART', 'BAR_CHART', 'CALCULATE',
                'RECEIPT_LONG', 'REQUEST_QUOTE',
                'EVENT', 'SCHEDULE', 'CELEBRATION', 'MAIL', 'NOTIFICATIONS', 'PUBLIC', 'CLOUD', 'LOCK',
                'KEY', 'VERIFIED', 'HELP', 'STAR', 'FAVORITE', 'BOOKMARK', 'FLAG', 'CATEGORY',
                'DESCRIPTION', 'BUILD', 'KEYBOARD', 'DELETE'
              )

  - changeSet:
      id: drop-category-emoji-column
      author: hptrk
      comment: Drop the old emoji column from category table
      dbms: postgresql
      changes:
        - dropColumn:
            tableName: category
            columnName: emoji

  - changeSet:
      id: add-category-icon-column
      author: hptrk
      comment: Add icon column to category table using native material_icon enum
      dbms: postgresql
      changes:
        - addColumn:
            tableName: category
            columns:
              - column:
                  name: icon
                  type: material_icon
                  constraints:
                    nullable: false

  - changeSet:
      id: add-category-color-column
      author: hptrk
      comment: Add color column to category table for storing hex color codes
      dbms: postgresql
      changes:
        - addColumn:
            tableName: category
            columns:
              - column:
                  name: color
                  type: VARCHAR(7)
                  constraints:
                    nullable: false

  - changeSet:
      id: add-category-color-check-constraint
      author: hptrk
      comment: Add check constraint to validate hex color format
      dbms: postgresql
      changes:
        - sql:
            sql: |
              ALTER TABLE category
              ADD CONSTRAINT chk_category_color_format
              CHECK (color ~ '^#[0-9A-Fa-f]{6}$')

