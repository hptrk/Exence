# Error messages
error.authentication-failed=Error de autenticación. Por favor, verifica tus credenciales e inténtalo de nuevo.
error.invalid-credentials=¡Combinación de nombre de usuario y contraseña incorrecta! Por favor, inténtalo de nuevo.
error.jwt-token-expired=Tu sesión ha expirado. Por favor, inicia sesión de nuevo.
