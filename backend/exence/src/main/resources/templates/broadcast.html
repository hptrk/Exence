<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{{subject}}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #121420;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background-color: #121420;
            color: #c9c9f2;
            padding: 20px;
            text-align: center;
            border-radius: 4px 4px 0 0;
        }

        .content {
            padding: 20px;
            background-color: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-top: none;
        }

        .button {
            display: inline-block;
            padding: 12px 24px;
            background-color: #121420;
            color: #c9c9f2;
            text-decoration: none;
            border-radius: 4px;
            margin: 20px 0;
            font-weight: bold;
        }

        .footer {
            padding: 20px;
            text-align: center;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>{{subject}}</h1>
    </div>
    <div class="content">
        {{content}}
    </div>
    <div class="footer">
        <p>Best regards,<br>The Exence Team</p>
        <p>Need help? Contact us at support@exence.com</p>
    </div>
</div>
</body>
</html>
