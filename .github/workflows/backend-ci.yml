name: Backend CI

on:
  pull_request:
    branches: [develop, main]
    paths: ['backend/**', '.github/workflows/backend-ci.yml']
  push:
    branches: [develop]
    paths: ['backend/**', '.github/workflows/backend-ci.yml']

env:
  GRADLE_OPTS: -Xmx1024m -XX:MaxMetaspaceSize=512m

jobs:
  build-and-quality:
    name: Quality, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: exence_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 5432:5432

    defaults:
      run:
        working-directory: backend/exence

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '23'
          cache: gradle
          cache-dependency-path: backend/exence/gradle/wrapper/gradle-wrapper.properties

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Check i18n key consistency
        run: bash scripts/check-i18n-keys.sh

      - name: Lint & unit tests
        run: ./gradlew spotlessCheck checkstyleMain checkstyleTest test jacocoTestReport assemble --no-daemon
        env:
          SPRING_PROFILES_ACTIVE: test
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/exence_test
          SPRING_DATASOURCE_USERNAME: test
          SPRING_DATASOURCE_PASSWORD: test

      - name: Integration tests
        run: ./gradlew integrationTest --no-daemon
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Upload unit test coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-unit-test-report
          path: backend/exence/build/reports/jacoco/test/html/
          retention-days: 7

      - name: Upload integration test coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-integration-test-report
          path: backend/exence/build/reports/jacoco/jacocoIntegrationTestReport/html/
          retention-days: 7

      - name: Add Coverage Comment to PR
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.6.1
        with:
          paths: |
            backend/exence/build/reports/jacoco/test/jacocoTestReport.xml
            backend/exence/build/reports/jacoco/jacocoIntegrationTestReport/jacocoIntegrationTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 70
          min-coverage-changed-files: 60
          title: 'Backend Code Coverage'
          update-comment: true
